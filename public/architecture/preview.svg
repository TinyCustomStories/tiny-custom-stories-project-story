<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Tiny Custom Stories public architecture preview</title>
  <desc id="desc">A simplified flow from family browser to web app and application API, then to Child Map, Story Lifecycle, context selection, and Story Generation.</desc>
  <rect width="1200" height="560" rx="32" fill="#27213B"/>
  <g font-family="system-ui, sans-serif" fill="#FFFDF7">
    <text x="54" y="64" font-size="22" font-weight="700">Tiny Custom Stories</text>
    <text x="54" y="94" font-size="14" opacity=".72">PUBLIC ARCHITECTURE · CURATED VIEW</text>
  </g>
  <g stroke="#FFFDF7" stroke-width="3" fill="none" opacity=".7">
    <path d="M210 280 H310"/><path d="M510 280 H610"/><path d="M810 280 H910"/>
    <path d="M710 325 V420 H910"/><path d="M1010 325 V420"/>
  </g>
  <g font-family="system-ui, sans-serif" fill="#27213B" stroke="#27213B" stroke-width="2">
    <g transform="translate(50 225)"><rect width="160" height="110" rx="20" fill="#F7B84B"/><text x="18" y="48" font-size="17" font-weight="700">Family</text><text x="18" y="73" font-size="13">browser</text></g>
    <g transform="translate(310 215)"><rect width="200" height="130" rx="20" fill="#FFFDF7"/><text x="20" y="54" font-size="17" font-weight="700">React web app</text><text x="20" y="80" font-size="12">parent + child surfaces</text></g>
    <g transform="translate(610 205)"><rect width="200" height="150" rx="20" fill="#9DD3C6"/><text x="20" y="58" font-size="17" font-weight="700">Application API</text><text x="20" y="85" font-size="12">family authority</text><text x="20" y="106" font-size="12">capability contracts</text></g>
    <g transform="translate(910 205)"><rect width="220" height="150" rx="20" fill="#E7D8F5"/><text x="18" y="52" font-size="17" font-weight="700">Child Map</text><text x="18" y="78" font-size="17" font-weight="700">+ Discovery</text><text x="18" y="108" font-size="12">implemented module</text></g>
    <g transform="translate(610 420)"><rect width="200" height="95" rx="18" fill="#FFFDF7"/><text x="18" y="41" font-size="16" font-weight="700">Story Lifecycle</text><text x="18" y="66" font-size="12">partial implementation</text></g>
    <g transform="translate(910 405)"><rect width="220" height="110" rx="18" fill="#E76042"/><text x="18" y="42" font-size="16" font-weight="700">Story capabilities</text><text x="18" y="68" font-size="12">accepted boundaries</text><text x="18" y="88" font-size="12">provider still open</text></g>
  </g>
  <text x="54" y="530" font-family="system-ui, sans-serif" font-size="13" fill="#FFFDF7" opacity=".72">Explore the interactive diagram for implementation status and capability boundaries.</text>
</svg>