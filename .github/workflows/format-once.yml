name: Temporary November dossier formatting
on:
  push:
    branches:
      - docs/nov04-delivery-stats-ci-dossier
    paths:
      - .github/workflows/format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - name: Format only edited public-story text files
        run: npx prettier src/App.tsx src/Lessons.tsx src/delivery-snapshot.json test/app.test.tsx test/reading.test.tsx README.md documentation/PublicProjectStory/README.md --write
      - name: Commit formatter result on this branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/Lessons.tsx src/delivery-snapshot.json test/app.test.tsx test/reading.test.tsx README.md documentation/PublicProjectStory/README.md
          if ! git diff --cached --quiet; then
            git commit -m "style: format November delivery narrative and tests"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
