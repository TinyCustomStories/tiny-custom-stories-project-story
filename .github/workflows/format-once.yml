name: Temporary sprint-story formatting
on:
  push:
    branches:
      - docs/nov04-sprints-4-5-5-5-public-story
    paths:
      - .github/workflows/format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - name: Format the changed sprint story and tests
        run: npx prettier src/App.tsx src/content.ts src/LaterSprints.tsx test/app.test.tsx --write
      - name: Commit formatter result on this PR branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/content.ts src/LaterSprints.tsx test/app.test.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Prettier to sprint-story updates"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
