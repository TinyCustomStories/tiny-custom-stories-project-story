name: Review Story Mode Visuals

on:
  push:
    branches:
      - feat/story-builder-reading-modes

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/tcs-vite.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tcs-vite.log
          exit 1

      - name: Capture responsive Story mode evidence
        run: |
          mkdir -p review-artifacts
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$BROWSER" --headless=new --no-sandbox --hide-scrollbars --force-device-scale-factor=1 --window-size=1440,1000 --screenshot=review-artifacts/story-home-desktop.png "http://127.0.0.1:4173/#/"
          "$BROWSER" --headless=new --no-sandbox --hide-scrollbars --force-device-scale-factor=1 --window-size=390,844 --screenshot=review-artifacts/story-home-mobile.png "http://127.0.0.1:4173/#/"
          "$BROWSER" --headless=new --no-sandbox --hide-scrollbars --force-device-scale-factor=1 --window-size=390,844 --screenshot=review-artifacts/story-product-mobile.png "http://127.0.0.1:4173/#/product"

      - name: Upload review evidence
        uses: actions/upload-artifact@v4
        with:
          name: story-mode-review-screenshots
          path: review-artifacts/
          retention-days: 1
