name: Public site CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install site dependencies
        run: npm ci

      - name: Apply repository formatter
        run: npm run format

      - name: Commit formatting to PR branch
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/content.ts test/app.test.tsx documentation/PublicProjectStory/ScreenshotEvidence.md
          git commit -m "style: apply repository formatting"
          git push

      - name: Install dossier dependency
        run: python -m pip install -r requirements-pdf.txt

      - name: Generate current project dossier
        run: npm run generate:pdf

      - name: Verify public site
        run: npm run verify
