name: Public site CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install site dependencies
        run: npm ci

      - name: Install dossier dependency
        run: python -m pip install -r requirements-pdf.txt

      - name: Generate current project dossier
        run: npm run generate:pdf

      - name: Commit generated dossier to PR branch
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- public/documents/tiny-custom-stories-project-dossier.pdf; then
            echo "Generated dossier already matches the branch."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/documents/tiny-custom-stories-project-dossier.pdf
            git commit -m "docs: regenerate public project dossier"
            git push
          fi

      - name: Verify public site
        run: npm run verify
