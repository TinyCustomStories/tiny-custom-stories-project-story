name: Public site CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install site dependencies
        run: npm ci

      - name: Install dossier dependency
        run: python -m pip install -r requirements-pdf.txt

      - name: Generate current project dossier
        run: npm run generate:pdf

      - name: Upload inspected dossier contact sheet
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dossier-pages
          path: build/dossier-contact-sheet.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Diagnose frontend formatting
        run: |
          npx prettier src/App.tsx --write
          git diff -- src/App.tsx
      - name: Verify public site
        run: npm run verify
