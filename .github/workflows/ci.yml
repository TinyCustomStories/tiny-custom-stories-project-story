name: Public site CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install site dependencies
        run: npm ci

      - name: Install dossier dependency
        run: python -m pip install -r requirements-pdf.txt

      - name: Generate current project dossier
        run: npm run generate:pdf

      - name: Verify public site
        run: npm run verify
