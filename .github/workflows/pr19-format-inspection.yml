name: Temporary PR 19 formatting inspection
on:
  push:
    branches:
      - docs/story-sync-20261009-epic-ci-lessons
    paths:
      - .github/workflows/pr19-format-inspection.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - name: Print exact formatting patch (no repository writes)
        run: |
          npx prettier --write src/App.tsx src/content.ts
          git diff -- src/App.tsx src/content.ts
